<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>The Million Dirham Spin | Performance Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--burgundy:#45011A;--burgundy-2:#5C0A27;--gold:#A68048;--blush:#D8A7B1;--blush-2:#F6E9EC;--rose:#C4808E;
  --bg:#FAFAF9;--panel:#FFFFFF;--line:#E6E2E0;--fg:#1B1B1B;--muted:#77706E;--soft:#F3F1F0;--chip:#ECE9E7;--green:#1F8A5B;--red:#C2273D}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;font-size:15px}
.num{font-variant-numeric:tabular-nums}
.in{max-width:1120px;margin:0 auto;padding:0 28px}

/* header band */
.hero{background:radial-gradient(520px 260px at 100% 30%,rgba(216,167,177,.16),transparent 70%),var(--burgundy);color:#fff;padding:34px 0 22px}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.brand{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--blush)}
.refresh{text-align:right;font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.7;white-space:nowrap}
.refresh b{display:block;color:#fff;font-weight:600;font-size:13.5px}
h1{font-size:54px;line-height:1.05;font-weight:300;margin:16px 0 12px;letter-spacing:.005em;text-transform:uppercase}
.asof{margin:0 0 22px;font-size:15px;color:rgba(255,255,255,.8);min-height:20px}.asof b{color:#fff;font-weight:600}.locked .asof{visibility:hidden}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{all:unset;cursor:pointer;font:500 14.5px Outfit,sans-serif;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:8px 18px;transition:background .15s,border-color .15s}
.tabs button:hover{border-color:rgba(255,255,255,.6)}
.tabs button[aria-pressed="true"]{background:var(--blush);border-color:var(--blush);color:var(--burgundy);font-weight:600}
.tabs button:focus-visible,.seg button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* filter row */
.bar{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar .in>div{display:flex;gap:10px 14px;flex-wrap:wrap;align-items:center;padding:14px 0}
.fg{display:flex;align-items:center;gap:10px;min-width:0}
.fg label{font-size:13px;color:var(--muted)}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;box-shadow:0 1px 2px rgba(0,0,0,.04);overflow-x:auto}
.seg button{all:unset;cursor:pointer;font:400 14px Outfit,sans-serif;color:var(--muted);padding:6px 13px;border-radius:999px;white-space:nowrap}
.seg button:hover{color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--chip);color:var(--fg);font-weight:500}

main{padding:34px 0 60px;display:flex;flex-direction:column;gap:20px}
.sec-t{display:flex;align-items:center;gap:14px;margin:10px 0 0;flex-wrap:wrap}
.sec-t:not(:first-child){margin-top:26px}
.sec-t span{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--rose);border:1.5px solid var(--blush);border-radius:999px;padding:4px 13px;font-weight:500;white-space:nowrap}
.sec-t h2{font-size:26px;font-weight:400;margin:0;letter-spacing:-.005em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 16px rgba(0,0,0,.04);padding:20px 22px;min-width:0}
.card h3{font-size:15px;font-weight:500;margin:0}
.card .cap{font-size:13px;color:var(--muted);margin:3px 0 18px;line-height:1.5}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.lead{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:end}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.g21{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(0,1fr);gap:14px}
.g12{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.45fr);gap:14px}
.g11{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.g21,.g12,.g11,.g3,.lead{grid-template-columns:minmax(0,1fr)}h1{font-size:38px}}
@media (max-width:560px){h1{font-size:30px}.in{padding:0 16px}.card{padding:16px}.refresh{display:none}.sec-t h2{font-size:22px}}

/* kpi */
.kpi-l{font-size:13.5px;font-weight:500;margin:0 0 10px}
.kpi-v{font-size:36px;font-weight:400;line-height:1.05;letter-spacing:-.015em}
.kpi.big .kpi-v{font-size:52px}
.kpi.big{padding:26px 26px 22px}
.kpi-v small{font-size:14px;font-weight:400;color:var(--muted);margin-left:5px;letter-spacing:0}
.kpi-n{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.5;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.kpi-d{font-size:13px;color:var(--muted);margin:8px 0 0}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:500;border-radius:7px;padding:2px 8px;font-size:13px;background:var(--chip);color:#5F5957}
.delta.down{background:#FBE6EA;color:var(--red)}.delta.up{background:#E4F2EA;color:var(--green)}
.spark{display:block;width:100%;height:34px;margin-top:12px}
.split{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--soft)}
.split i{display:block;height:100%}

/* charts */
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:6px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{font-size:12px;fill:var(--muted);font-family:inherit}
.chart .val{fill:var(--fg);font-weight:500}
.tip{position:absolute;pointer-events:none;background:#1B1B1B;color:#fff;border-radius:10px;padding:8px 11px;font-size:12.5px;line-height:1.5;white-space:nowrap;z-index:5;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.tip b{font-weight:600}
.donut{display:flex;align-items:center;gap:18px;flex-wrap:wrap;justify-content:center}
.donut svg{width:170px;height:170px;flex:none}
.dl{display:flex;flex-direction:column;gap:12px;min-width:150px;flex:1}
.dl div{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14px}
.dl span i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:8px}
.dl b{font-weight:500;font-size:18px}
.dl small{color:var(--muted);margin-left:6px;font-size:13px}

/* location cards */
.loc{display:flex;flex-direction:column;gap:16px}
.loc-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.loc-h h3{display:flex;align-items:center;gap:8px}
.loc-h h3 i{width:10px;height:10px;border-radius:3px;display:inline-block}
.rank{font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:#5F5957;background:var(--chip);border-radius:7px;padding:3px 9px;white-space:nowrap}
.big{font-size:40px;font-weight:400;letter-spacing:-.015em;line-height:1}
.big small{font-size:13.5px;color:var(--muted);font-weight:400;margin-left:8px;letter-spacing:0}
.meter-l{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:7px;gap:8px}
.meter-l b{color:var(--fg);font-weight:500}
.meter{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:var(--burgundy)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);padding-top:14px}
.mini div{font-size:12.5px;color:var(--muted)}
.mini b{display:block;font-size:18px;color:var(--fg);font-weight:400;margin-bottom:2px}

/* funnel-style rows / tables */
.rows{display:flex;flex-direction:column;gap:12px}
.frow{display:grid;grid-template-columns:minmax(120px,210px) minmax(0,1fr) 92px;gap:14px;align-items:center}
.frow .n{font-size:14.5px}.frow .n small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.frow .track{background:var(--soft);border-radius:7px;height:30px;overflow:hidden}
.frow .stack{display:flex;height:100%;border-radius:7px;overflow:hidden;min-width:3px}
.frow .stack i{display:block;height:100%}
.frow .v{font-size:14px;color:var(--muted);white-space:nowrap}.frow .v b{color:var(--fg);font-weight:500;margin-right:6px}
@media (max-width:560px){.frow{grid-template-columns:minmax(0,1fr) 80px}.frow .track{grid-column:1/-1;order:3;height:18px}}
.scroll{overflow:auto;max-height:460px;margin:0 -6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{position:sticky;top:0;background:var(--panel);text-align:right;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:150px}
tbody tr:hover td{background:var(--bg)}
td .tag{display:inline-block;font-size:10.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle;background:var(--chip);color:#5F5957}
td .ib{display:inline-block;height:6px;border-radius:99px;background:var(--blush);vertical-align:middle;margin-right:8px}
tr.total td{font-weight:500;border-bottom:0;background:var(--bg)}

/* cost */
.target{position:relative;height:14px;border-radius:7px;background:var(--soft);margin:36px 0 34px}
.target i{position:absolute;inset:0 auto 0 0;border-radius:7px}
.target .mx{background:var(--blush)}.target .ex{background:var(--burgundy)}
.target span{position:absolute;top:-25px;transform:translateX(-50%);font-size:12px;color:var(--muted);white-space:nowrap}
.target span.b{top:21px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tile p{margin:0;font-size:13px;font-weight:500}
.tile b{display:block;font-size:26px;font-weight:400;margin:6px 0 2px;letter-spacing:-.01em}
.tile small{font-size:12.5px;color:var(--muted)}
.msg{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:44px;text-align:center;color:var(--muted)}
.lock{max-width:440px;margin:40px auto;text-align:center;padding:34px 30px}
.lock h3{font-size:22px;font-weight:400;margin:0 0 6px}
.lock p{color:var(--muted);font-size:14px;line-height:1.55;margin:0 0 20px}
.lock input{width:100%;font:400 16px Outfit,sans-serif;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-align:center;letter-spacing:.06em;outline:none}
.lock input:focus{border-color:var(--burgundy);box-shadow:0 0 0 3px var(--blush-2)}
.lock button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;margin-top:12px;background:var(--burgundy);color:#fff;border-radius:999px;padding:12px;font:500 15px Outfit,sans-serif;text-align:center}
.lock button[disabled]{opacity:.6;cursor:wait}
.lock .err{color:var(--red);font-size:13.5px;min-height:20px;margin:12px 0 0}
.locked .bar,.locked .tabs,.locked footer{display:none}
.lockbtn{all:unset;cursor:pointer;font-size:12.5px;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:3px 11px;margin-top:6px;display:inline-block}
/* daily report + calculator */
.rep{border-collapse:separate;border-spacing:0;font-size:13px;width:100%}
.rep th,.rep td{padding:8px 10px;text-align:center;white-space:nowrap;border-bottom:1px solid var(--line);min-width:64px}
.rep th{position:static;font-size:11.5px;letter-spacing:.02em;text-transform:none;color:var(--fg);font-weight:600;background:var(--soft)}
.rep th:first-child,.rep td:first-child{position:sticky;left:0;z-index:2;text-align:left;min-width:150px;white-space:nowrap;background:var(--panel);font-weight:500;border-right:1px solid var(--line)}
.rep th:first-child{background:var(--burgundy);color:#fff;letter-spacing:.08em;text-transform:uppercase;border-radius:6px 0 0 0}
.rep tr.p td{color:var(--muted);font-size:12px}
.rep tr.e td{background:#FCF7F8}
.rep tr.e td:first-child{background:#FCF7F8;color:var(--burgundy)}
.rep .now{background:var(--blush-2)!important}
.rep th.now{color:var(--burgundy)}
.rep .tot{font-weight:600;border-left:1px solid var(--line)}
.rep .na{color:#C9C4C2}
.rep tbody tr:hover td{background:var(--bg)}
.dl-btn{all:unset;cursor:pointer;margin-left:auto;background:var(--burgundy);color:#fff;border-radius:999px;padding:9px 18px;font:500 14px Outfit,sans-serif}.dl-btn:hover{background:var(--burgundy-2)}
.trk{font-size:13.5px}.trk td{padding:8px 0;white-space:normal}.trk td:first-child{min-width:0;color:var(--muted);font-weight:400}.trk tr:last-child td{border-bottom:0}
.calc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
@media (max-width:860px){.calc{grid-template-columns:minmax(0,1fr)}}
.sl{margin-bottom:22px}
.sl-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:14.5px}
.sl-h b{font-size:26px;font-weight:400}
.sl small{display:block;color:var(--muted);font-size:12.5px;margin-top:6px}
input[type=range]{width:100%;accent-color:var(--burgundy);height:28px;margin:0}
.fun{display:flex;flex-direction:column;gap:12px}
footer{color:var(--muted);font-size:13px;line-height:1.7;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body class="locked">
<div class="hero"><div class="in">
  <div class="top">
    <div class="brand">Emirates NBD SHARE Visa Credit Card</div>
    <div class="refresh">Last data refresh<b id="pill-t">Locked</b><button type="button" class="lockbtn" id="lockbtn" hidden>Lock</button></div>
  </div>
  <h1>The Million Dirham Spin</h1>
  <p class="asof" id="asof"></p>
  <div class="tabs" id="tabs"></div>
</div></div>

<div class="bar"><div class="in"><div>
  <div class="fg"><div class="seg" id="f-per"></div></div>

  <div class="fg"><label>Audience</label><div class="seg" id="f-aud"></div></div>
</div></div></div>

<div class="in"><main id="app"><div class="msg">Loading activation data</div></main>
<footer id="foot"></footer><div style="height:40px"></div></div>

<script>
/* ───────── Reference data ───────── */
var LOCS=[
  {code:'MOE',name:'Mall of the Emirates',short:'MOE',color:'#45011A',planPerDay:0,planTotal:0,firstFullDay:'2026-11-18'},
  {code:'MCC',name:'City Centre Mirdif',short:'Mirdif',color:'#A68048',planPerDay:0,planTotal:0,firstFullDay:'2026-11-18'},
  {code:'DCC',name:'City Centre Deira',short:'Deira',color:'#D8A7B1',planPerDay:0,planTotal:0,firstFullDay:'2026-11-17'}
];
/* Plan, prize values and budget are not in this file: they arrive encrypted (config.enc.json) and are unlocked with the passphrase. */
var PRIZE_VALUE={},BUDGET=[];
var REWARDS_TARGET=0,APPROVE_EXPECTED=0.10,APPROVE_MAX=0.20;
var CATS=[['Bonus Millionaire tickets','#45011A'],['Carrefour vouchers','#A68048'],['SHARE Points','#D8A7B1'],['Big-ticket prizes','#1E0A10']];
var CH_COL='#45011A',NCH_COL='#D8A7B1';

/* ───────── helpers ───────── */
var f0=function(n){return Math.round(n).toLocaleString('en-US');};
var fk=function(n){return n>=1e6?(Math.round(n/1e4)/100)+'M':n>=1e4?Math.round(n/1e3)+'K':f0(n);};
var pct=function(a,b){return b?Math.round(100*a/b):0;};
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
var dShort=function(s){var p=s.split('-');return (+p[2])+' '+MON[+p[1]-1];};
var dDow=function(s){var p=s.split('-');return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(Date.UTC(+p[0],+p[1]-1,+p[2])).getUTCDay()];};
var sum=function(a,fn){var t=0;for(var i=0;i<a.length;i++)t+=fn(a[i]);return t;};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var h=function(html){var t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstChild;};
var NS='http://www.w3.org/2000/svg';
var S=function(tag,a,text){var e=document.createElementNS(NS,tag);for(var k in (a||{}))e.setAttribute(k,a[k]);if(text!=null)e.textContent=text;return e;};
function catOf(p){if(p.indexOf('Millionaire')>=0)return 0;if(/voucher/i.test(p))return 1;if(p.indexOf('SHARE Points')>=0)return 2;return 3;}
function enrich(r){var v=/AED ([\d,]+) voucher/.exec(r.p),s=/^([\d,]+) SHARE Points/.exec(r.p),t=/^\+(\d+) bonus/.exec(r.p);
  return {date:r.d,ch:r.c===1,loc:r.l,prize:r.p,cat:catOf(r.p),voucher:v?+v[1].replace(/,/g,''):0,points:s?+s[1].replace(/,/g,''):0,tickets:t?+t[1]:0,value:PRIZE_VALUE[r.p]||0};}
function tot(rows){var ch=0,v=0,p=0,t=0;rows.forEach(function(r){if(r.ch)ch++;v+=r.voucher;p+=r.points;t+=r.tickets;});return {spins:rows.length,ch:ch,nch:rows.length-ch,voucher:v,points:p,tickets:t};}
function tipFor(box){var t=h('<div class="tip" hidden></div>');box.appendChild(t);return {show:function(ev,html){t.innerHTML=html;t.hidden=false;var b=box.getBoundingClientRect();t.style.left=Math.min(Math.max(ev.clientX-b.left+12,0),Math.max(b.width-t.offsetWidth-4,0))+'px';t.style.top=Math.max(ev.clientY-b.top-t.offsetHeight-10,0)+'px';},hide:function(){t.hidden=true;}};}

/* ───────── state ───────── */
var ALL=[],META={},F={tab:'pulse',loc:'ALL',aud:'ALL',per:'ALL'};
var END={MOE:'2026-12-04',MCC:'2026-12-04',DCC:'2026-12-16'}; /* last day of each booth */
var PLAN_START={MOE:'2026-11-15',MCC:'2026-11-15',DCC:'2026-11-17'},PLAN_DAYS={MOE:20,MCC:20,DCC:30}; /* planned window */
var TARGET=null; /* card and rewards targets, from the encrypted config */
var FB='all'; /* run-rate basis: all days or last 3 */
var R={apply:40,conv:18}; /* % of non-cardholders who apply, and % of applications that convert */
try{var _r=JSON.parse(localStorage.getItem('mds-rates')||'null');if(_r&&_r.apply>=0&&_r.conv>=0)R=_r;}catch(e){}
var f1=function(n){return (Math.round(n*10)/10).toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});};
function seg(id,key,opts){var box=document.getElementById(id);box.replaceChildren();opts.forEach(function(o){var b=h('<button type="button" aria-pressed="'+(F[key]===o[0])+'">'+esc(o[1])+'</button>');b.onclick=function(){F[key]=o[0];filters();render();};box.appendChild(b);});}
function filters(){
  var tb=document.getElementById('tabs');tb.replaceChildren();[['pulse','Pulse'],['snap','Snapshot'],['report','Daily report'],['locations','Locations'],['prizes','Prizes'],['forecast','Forecast'],['calc','Calculator'],['cost','Cost']].forEach(function(o){var b=h('<button type="button" aria-pressed="'+(F.tab===o[0])+'">'+o[1]+'</button>');b.onclick=function(){F.tab=o[0];filters();render();window.scrollTo({top:0});};tb.appendChild(b);});
  seg('f-loc','loc',[['ALL','All']].concat(LOCS.map(function(l){return [l.code,l.short];})));
  seg('f-aud','aud',[['ALL','All'],['CH','Cardholders'],['NCH','Non-cardholders']]);
  seg('f-per','per',[['ALL','All time'],['7','Last 7 days'],['1','Latest day']]);
}
function view(){
  var days=Array.from(new Set(ALL.map(function(r){return r.date;}))).sort(),keep=F.per==='ALL'?days:days.slice(-(+F.per));
  var set=new Set(keep);

      var fr=function(name,sub,val,w,col,right){return '<div class="frow"><div class="n">'+name+'<small>'+sub+'</small></div><div class="track"><div class="stack" style="width:'+w+'%"><i style="flex:1;background:'+col+'"></i></div></div><div class="v num"><b>'+val+'</b>'+right+'</div></div>';};
      document.getElementById('calc-out').innerHTML='<h3>Estimated funnel</h3><p class="cap">From the non-cardholders in the current filters</p><div class="kpi-v num" style="font-size:52px">'+f0(cd)+'<small>estimated new cards</small></div><p class="kpi-n" style="margin-bottom:22px"><span class="delta">'+f1(100*a*c)+'%</span> of non-cardholder players end up with a card</p><div class="fun">'+
        fr('Non-cardholders','played, no card yet',f0(n),100,'#D8A7B1','')+fr('Applications','apply for the card',f0(ap),100*a,'#A68048',R.apply+'%')+fr('New cards','approved and activated',f0(cd),100*a*c,'#45011A',R.conv+'%')+'</div>';
      var body=shown.map(function(l){var g=rows.filter(function(r){return r.loc===l.code;}),x=tot(g);return '<tr><td>'+esc(l.name)+'</td><td class="num">'+f0(x.spins)+'</td><td class="num">'+f0(x.ch)+'</td><td class="num">'+f0(x.nch)+'</td><td class="num">'+f0(x.nch*a)+'</td><td class="num">'+f1(x.nch*a*c)+'</td></tr>';}).join('');
      document.getElementById('calc-tab').innerHTML='<div class="scroll" style="margin:0"><table><thead><tr><th>Location</th><th>Spins</th><th>Cardholders</th><th>Non-cardholders</th><th>Est. applications</th><th>Est. new cards</th></tr></thead><tbody>'+body+(shown.length>1?'<tr class="total"><td>Total</td><td class="num">'+f0(T.spins)+'</td><td class="num">'+f0(T.ch)+'</td><td class="num">'+f0(n)+'</td><td class="num">'+f0(ap)+'</td><td class="num">'+f1(cd)+'</td></tr>':'')+'</tbody></table></div>';
    };
    var set=function(){R.apply=+document.getElementById('r-apply').value;R.conv=+document.getElementById('r-conv').value;try{localStorage.setItem('mds-rates',JSON.stringify(R));}catch(e){}fill();};
    document.getElementById('r-apply').oninput=set;document.getElementById('r-conv').oninput=set;
    document.getElementById('r-reset').onclick=function(){document.getElementById('r-apply').value=40;document.getElementById('r-conv').value=18;set();};
    fill();
  }
  var box=document.getElementById('c-daily');if(box)drawDaily(box,rows);
  window.onresize=function(){clearTimeout(window.__rz);window.__rz=setTimeout(function(){var b=document.getElementById('c-daily');if(b)drawDaily(b,view());},150);};

  var unv=Array.from(new Set(ALL.filter(function(r){return r.cat!==0&&!r.value;}).map(function(r){return r.prize;})));
  var foot='One row per play as reported by Emirates NBD. The sheet has no player IDs or time of day, so each play counts as one person.';
  if(unv.length)foot+=' Not yet valued in the cost section: '+unv.join(', ')+'.';
  if(META.skipped&&META.skipped.length)foot+=' '+META.skipped.length+' sheet row(s) left out because the date, location or prize is missing.';
  document.getElementById('foot').textContent=foot;
}
function stamp(){var u=new Date(META.updated);document.getElementById('pill-t').textContent=u.toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Dubai'})+', '+u.toLocaleString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Dubai'});var ld=ALL.reduce(function(m,r){return r.date>m?r.date:m;},'');document.getElementById('asof').innerHTML=ld?'Data last updated for <b>'+dDow(ld)+' '+dShort(ld)+' '+ld.slice(0,4)+'</b>':'';}
/* ───────── unlock + load (all figures are encrypted at rest) ───────── */
var PRIV=null;
var ub=function(t){var b=atob(t),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;};
var getJ=function(f){return fetch(f+'?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('load');return r.json();});};
function unlock(pass){
  return getJ('keys.json').then(function(k){
    return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']).then(function(m){
      return crypto.subtle.deriveKey({name:'PBKDF2',salt:ub(k.kdf.salt),iterations:k.kdf.iter,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);
    }).then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:ub(k.wrapped.iv)},key,ub(k.wrapped.ct));})
      .then(function(pk8){return crypto.subtle.importKey('pkcs8',pk8,{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);},function(){throw new Error('pass');});
  });
}
function open1(blob){
  return crypto.subtle.decrypt({name:'RSA-OAEP'},PRIV,ub(blob.k)).then(function(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);})
    .then(function(key){return crypto.subtle.decrypt({name:'AES-GCM',iv:ub(blob.iv)},key,ub(blob.ct));}).then(function(buf){return JSON.parse(new TextDecoder().decode(buf));});
}
function load(){
  if(!PRIV)return Promise.resolve();
  return getJ('data.enc.json').then(open1).then(function(d){META=d;ALL=d.rows.filter(function(r){return r&&/^\d{4}-\d{2}-\d{2}$/.test(r.d)&&/^(MOE|MCC|DCC)$/.test(r.l)&&typeof r.p==='string'&&r.p.length<120;}).map(enrich);stamp();filters();render();}).catch(function(){
    if(ALL.length)return;document.getElementById('pill-t').textContent='Not loaded';
    document.getElementById('app').replaceChildren(h('<div class="msg">The activation data could not be loaded. Please refresh in a minute.</div>'));});
}
function start(pass,quiet){
  return unlock(pass).then(function(pk){PRIV=pk;return getJ('config.enc.json').then(open1);}).then(function(c){
    LOCS.forEach(function(l){l.planPerDay=c.plan[l.code][0];l.planTotal=c.plan[l.code][1];});PRIZE_VALUE=c.prizeValue;TARGET=c.targets;BUDGET=c.budget;REWARDS_TARGET=c.rewardsTarget;
    try{sessionStorage.setItem('mds-pass',pass);}catch(e){}
    document.body.classList.remove('locked');document.getElementById('lockbtn').hidden=false;return load();});
}
function lockScreen(msg){
  PRIV=null;ALL=[];document.body.classList.add('locked');document.getElementById('lockbtn').hidden=true;document.getElementById('pill-t').textContent='Locked';
  var c=h('<div class="card lock"><h3>This dashboard is protected</h3><p>Enter the passphrase to view the activation figures.</p><input type="password" id="pw" autocomplete="current-password" aria-label="Passphrase" placeholder="Passphrase"><button type="button" id="go">Unlock</button><p class="err" id="pw-err"></p></div>');
  document.getElementById('app').replaceChildren(c);
  var inp=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('pw-err');err.textContent=msg||'';
  var run=function(){var v=inp.value.trim();if(!v)return;go.disabled=true;go.textContent='Unlocking';err.textContent='';
    start(v).catch(function(e){go.disabled=false;go.textContent='Unlock';err.textContent=e&&e.message==='pass'?'That passphrase is not right.':'Could not load the dashboard. Please try again.';inp.select();});};
  go.onclick=run;inp.onkeydown=function(ev){if(ev.key==='Enter')run();};inp.focus();
}
document.getElementById('lockbtn').onclick=function(){try{sessionStorage.removeItem('mds-pass');}catch(e){}lockScreen();};
(function(){var saved=null;try{saved=sessionStorage.getItem('mds-pass');}catch(e){}
  if(!(window.crypto&&crypto.subtle)){document.getElementById('app').replaceChildren(h('<div class="msg">This browser cannot open the protected dashboard. Please use a current version of Chrome, Safari or Edge.</div>'));return;}
  if(saved){document.getElementById('app').replaceChildren(h('<div class="msg">Unlocking</div>'));start(saved).catch(function(){try{sessionStorage.removeItem('mds-pass');}catch(e){}lockScreen();});}else lockScreen();})();
setInterval(load,10*60*1000);
</script>
