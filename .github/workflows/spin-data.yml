name: Million Dirham Spin data refresh

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes
  workflow_dispatch:          # "Run workflow" button for a refresh on demand

permissions:
  contents: write

concurrency:
  group: spin-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openpyxl
      - run: python scripts/fetch_spin_data.py
      - name: Commit if the data changed
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "spin-data-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data.json
            git commit -m "Million Dirham Spin: data refresh"
            git push
          fi
